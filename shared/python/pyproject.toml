[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-ops-agent-common"
version = "1.3.0"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<0.29", "psycopg[binary]>=3.2,<3.3", "pydantic>=2.11,<3", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
