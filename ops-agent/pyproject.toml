[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-agent"
version = "1.3.0"
requires-python = ">=3.11,<3.14"
dependencies = ["gpu-ops-agent-common==1.3.0", "nvidia-nat==1.5.0", "nvidia-nat-mcp==1.5.0", "langchain-core==1.6.3"]

[project.scripts]
ops-agent = "ops_agent.main:main"

[project.entry-points.'nat.components']
ops_agent = "ops_agent.nat_workflow"

[tool.setuptools.packages.find]
where = ["src"]
