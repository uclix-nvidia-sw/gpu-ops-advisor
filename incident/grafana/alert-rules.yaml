# Grafana-managed alert rules that feed GPU Ops Incident from Fleet Intelligence logs.
# Render the ${...} placeholders (see incident/README.md#grafana-알림-규칙) before provisioning.
# Every rule raises GPUAlert, which has an Incident analysis policy (RCA).
# Fatal/Critical XID and SXID come from the repeating Fleet state lines so a lost event line cannot
# drop an alert; event lines add every other XID/SXID event, which never changes the component state.
# The component rule takes every Fleet component except the XID/SXID ones the two rules above own.
# A failed Loki query keeps the last state (KeepLast) so it does not open an incident.
# tools/ci/tests/test_alert_rules.py checks this split against the runbook catalog.
apiVersion: 1
groups:
  - orgId: ${GRAFANA_ORG_ID}
    name: gpu-ops-advisor-states
    folder: ${GRAFANA_FOLDER}
    interval: 1m
    rules:
      - uid: gpuops-xid-sxid-state
        title: GPUAlert
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: ${LOKI_DATASOURCE_UID}
            model:
              datasource:
                type: loki
                uid: ${LOKI_DATASOURCE_UID}
              editorMode: code
              expr: |-
                sum by (cluster_id, component, reason, suggested_actions, k8s_node_name, machine_id) (
                  count_over_time(
                    {cluster_id=~".+", job="fleet-intelligence-agent"}
                      | json log_type=`attributes["log_type"]`, health=`attributes["health"]`,
                             component=`attributes["component"]`, reason=`attributes["reason"]`,
                             suggested_actions=`attributes["suggested_actions"]`,
                             k8s_node_name=`resources["k8s.node.name"]`, machine_id=`resources["machine.id"]`
                      | __error__="" | log_type="component_data" | health=~"Unhealthy|Degraded" | machine_id!=""
                      | component=~"accelerator-nvidia-error-(xid|sxid)"
                    [1m]
                  )
                )
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
        noDataState: OK
        execErrState: KeepLast
        annotations:
          description: |-
            클러스터: {{ $labels.cluster_id }}
            노드: {{ $labels.k8s_node_name }}
            오류: {{ $labels.reason }}
        isPaused: false
        notification_settings:
          receiver: ${GPU_OPS_CONTACT_POINT}
  - orgId: ${GRAFANA_ORG_ID}
    name: gpu-ops-advisor-events
    folder: ${GRAFANA_FOLDER}
    interval: 1m
    rules:
      - uid: gpuops-xid-sxid-rca
        title: GPUAlert
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ${LOKI_DATASOURCE_UID}
            model:
              datasource:
                type: loki
                uid: ${LOKI_DATASOURCE_UID}
              editorMode: code
              expr: |-
                sum by (cluster_id, component, event_type, code, device, reason, k8s_node_name, machine_id) (
                  count_over_time(
                    {cluster_id=~".+", job="fleet-intelligence-agent"}
                      | json log_type=`attributes["log_type"]`, component=`attributes["component"]`,
                             event_name=`attributes["event_name"]`, event_type=`attributes["event_type"]`,
                             xid=`attributes["extra_info"]["data"]["xid"]`, sxid=`attributes["extra_info"]["data"]["sxid"]`,
                             device=`attributes["extra_info"]["device_uuid"]`, reason=`body`,
                             k8s_node_name=`resources["k8s.node.name"]`, machine_id=`resources["machine.id"]`
                      | __error__="" | log_type="event" | event_name=~"error_(xid|sxid)" | machine_id!=""
                      | label_format code=`{{ if .xid }}xid:{{ .xid }}{{ else }}sxid:{{ .sxid }}{{ end }}`
                      | event_type!~"Fatal|Critical"
                    [10m]
                  )
                )
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
        noDataState: OK
        execErrState: KeepLast
        annotations:
          description: |-
            클러스터: {{ $labels.cluster_id }}
            노드: {{ $labels.k8s_node_name }}
            오류: {{ $labels.reason }}
        isPaused: false
        notification_settings:
          receiver: ${GPU_OPS_CONTACT_POINT}
  - orgId: ${GRAFANA_ORG_ID}
    name: gpu-ops-advisor-components
    folder: ${GRAFANA_FOLDER}
    interval: 1m
    rules:
      - uid: gpuops-component-rca
        title: GPUAlert
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: ${LOKI_DATASOURCE_UID}
            model:
              datasource:
                type: loki
                uid: ${LOKI_DATASOURCE_UID}
              editorMode: code
              expr: |-
                sum by (cluster_id, component, reason, suggested_actions, k8s_node_name, machine_id) (
                  count_over_time(
                    {cluster_id=~".+", job="fleet-intelligence-agent"}
                      | json log_type=`attributes["log_type"]`, health=`attributes["health"]`,
                             component=`attributes["component"]`, reason=`attributes["reason"]`,
                             suggested_actions=`attributes["suggested_actions"]`,
                             k8s_node_name=`resources["k8s.node.name"]`, machine_id=`resources["machine.id"]`
                      | __error__="" | log_type="component_data" | health="Unhealthy" | machine_id!=""
                      | component!~"accelerator-nvidia-error-(xid|sxid)"
                    [1m]
                  )
                )
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
        noDataState: OK
        execErrState: KeepLast
        annotations:
          description: |-
            클러스터: {{ $labels.cluster_id }}
            노드: {{ $labels.k8s_node_name }}
            오류: {{ $labels.reason }}
        isPaused: false
        notification_settings:
          receiver: ${GPU_OPS_CONTACT_POINT}
