name: gpu-ops-agents
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: dsx
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dsx
    volumes:
      - agent-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dsx -d dsx"]
      interval: 3s
      retries: 20
  job-controller:
    build:
      context: ..
      dockerfile: job-controller/Dockerfile
    environment:
      DATABASE_URL: postgresql://dsx:local-development-only@postgres:5432/dsx
      JC_ADDRESS: 0.0.0.0:8090
      DSX_ALLOW_UNAUTHENTICATED_NETWORK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8090:8090"]
  grafana-mcp:
    build:
      context: ..
      dockerfile: grafana-mcp/Dockerfile
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-http://host.docker.internal:3000}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
  rcca-agent:
    build:
      context: ..
      dockerfile: rcca-agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dsx:local-development-only@postgres:5432/dsx
      JC_URL: http://job-controller:8090/internal/v1
      GRAFANA_MCP_URL: http://grafana-mcp:8000/mcp
      WORKER_ID: rcca-agent-1
    volumes:
      - ./config.example.json:/app/agents/config.example.json:ro
    depends_on: [job-controller, grafana-mcp]
    restart: unless-stopped
  ops-agent:
    build:
      context: ..
      dockerfile: ops-agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dsx:local-development-only@postgres:5432/dsx
      JC_URL: http://job-controller:8090/internal/v1
      GRAFANA_MCP_URL: http://grafana-mcp:8000/mcp
      WORKER_ID: ops-agent-1
    volumes:
      - ./config.example.json:/app/agents/config.example.json:ro
      - agent-artifacts:/app/artifacts
    depends_on: [job-controller, grafana-mcp]
    restart: unless-stopped
volumes:
  agent-db:
  agent-artifacts:
