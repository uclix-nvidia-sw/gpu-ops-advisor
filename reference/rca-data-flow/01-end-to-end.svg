<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 1264" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">01  CPC 알람부터 RCA 결과 공개까지</title><desc id="overview-desc">샘플: cpc-1 / dgx01 / XID 79 · 기본 입력 계약 1.3 · 예시 값이며 실제 운영 DB에서 관측한 결과가 아닙니다.</desc><defs><style>text{font-family:'Geist','Noto Sans KR','Malgun Gothic',sans-serif;fill:#2d3142}
.title{font-family:'Instrument Serif','Noto Serif KR','Malgun Gothic',serif;font-size:40px}
.name{font-size:16px;font-weight:600}.body{font-size:12px}.mono{font-family:'Geist Mono','Consolas','Malgun Gothic',monospace;font-size:12px}
.muted{fill:#4f5d75}.tag{font-size:12px;font-weight:600;fill:#2e5aa8}.tiny{font-size:11px}.accent{fill:#eb6c36}
</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs>
<rect width="1584" height="1264" fill="#f5f5f5"/>
<text x="40" y="40" class="mono muted" text-anchor="start">GPU OPS ADVISOR  /  MAIN 02aec60  /  2026-09-28</text><text x="40" y="96" class="title" text-anchor="start">01  CPC 알람부터 RCA 결과 공개까지</text><text x="40" y="128" class="body muted" text-anchor="start">샘플: cpc-1 / dgx01 / XID 79 · 기본 입력 계약 1.3 · 예시 값이며 실제 운영 DB에서 관측한 결과가 아닙니다.</text><path d="M504 388 H560" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/><path d="M1024 388 H1080" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/><path d="M1312 568 V604 Q1312 612 1304 612 H280 Q272 612 272 620 V656" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/><rect x="660.0" y="583" width="260" height="22" rx="2" fill="#f5f5f5" stroke="#f5f5f5"/><text x="790" y="598" class="mono muted" text-anchor="middle">POST /jobs/rca · source_key 고정</text><path d="M504 852 H560" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)"/><path d="M1024 852 H1080" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/><rect x="40" y="176" width="464" height="392" rx="8" fill="white" stroke="#bfc0c0"/><text x="60" y="204" class="name" text-anchor="start">01  CPC → CSC 관측 저장</text><text x="60" y="228" class="body muted" text-anchor="start">Fleet Agent / exporter → 수집 경로 → Loki·Mimir</text><text x="60" y="264" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="60" y="290" class="mono" text-anchor="start">cluster_id = &quot;cpc-1&quot;</text><text x="60" y="311" class="mono" text-anchor="start">k8s_node_name = &quot;dgx01&quot;</text><text x="60" y="332" class="mono" text-anchor="start">component = &quot;accelerator-nvidia-error-xid&quot;</text><text x="60" y="353" class="mono" text-anchor="start">reason = &quot;XID 79 ... fallen off the bus ...&quot;</text><text x="60" y="374" class="mono" text-anchor="start">suggested_actions = {repair_actions:[REBOOT_SYSTEM]}</text><path d="M60 396 H484" stroke="#bfc0c0"/><text x="60" y="422" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="60" y="448" class="mono" text-anchor="start">관측 저장소: Loki(log) / Mimir(metric)</text><text x="60" y="469" class="mono" text-anchor="start">R  Grafana가 datasource를 조회</text><text x="60" y="490" class="mono" text-anchor="start">PostgreSQL 사건 테이블 쓰기는 아직 없음</text><text x="60" y="511" class="mono" text-anchor="start">metric 샘플: GPU_UTIL = 0 percent</text><text x="60" y="544" class="body muted" text-anchor="start">상류 전송 방식·metric 값은 예시; 실제 수집 구성을 대조합니다.</text><rect x="560" y="176" width="464" height="392" rx="8" fill="white" stroke="#bfc0c0"/><text x="580" y="204" class="name" text-anchor="start">02  CSC Grafana Alert</text><text x="580" y="228" class="body muted" text-anchor="start">룰 평가 → Contact point → POST /webhooks/grafana</text><text x="580" y="264" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="580" y="290" class="mono" text-anchor="start">alerts[0].status = &quot;firing&quot;</text><text x="580" y="311" class="mono" text-anchor="start">labels.alertname = &quot;GPUAlert&quot;</text><text x="580" y="332" class="mono" text-anchor="start">labels.cluster_id = &quot;cpc-1&quot;</text><text x="580" y="353" class="mono" text-anchor="start">fingerprint = &quot;demo-xid79-dgx01&quot;</text><text x="580" y="374" class="mono" text-anchor="start">startsAt = &quot;2026-09-28T03:00:00Z&quot;</text><path d="M580 396 H1004" stroke="#bfc0c0"/><text x="580" y="422" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="580" y="448" class="mono" text-anchor="start">R  Loki / Mimir의 룰 평가 데이터</text><text x="580" y="469" class="mono" text-anchor="start">Fleet 라벨만으로는 webhook 계약이 아님</text><text x="580" y="490" class="mono" text-anchor="start">alerts[] + status + fingerprint + startsAt 필요</text><text x="580" y="511" class="mono" text-anchor="start">원문 전체 예시: sample-data.json</text><text x="580" y="544" class="body muted" text-anchor="start">Grafana 내부 DB가 아닌 제품 PostgreSQL에서 이후를 추적합니다.</text><rect x="1080" y="176" width="464" height="392" rx="8" fill="#fff7f2" stroke="#eb6c36"/><text x="1100" y="204" class="name" text-anchor="start">03  Incident: 접수·고정·전달</text><text x="1100" y="228" class="body muted" text-anchor="start">원문 보존 / 중복 확인 / 분석 정책 / outbox</text><text x="1100" y="264" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="1100" y="290" class="mono" text-anchor="start">incident_id = I · evidence_version = 1</text><text x="1100" y="311" class="mono" text-anchor="start">snapshot = {input, alert, eligible:true, ...}</text><text x="1100" y="332" class="mono" text-anchor="start">purpose_ids = [&quot;R01&quot;, &quot;R02&quot;]</text><text x="1100" y="353" class="mono" text-anchor="start">time_range = 02:30:00Z ~ 03:00:05Z</text><text x="1100" y="374" class="mono" text-anchor="start">source_key = incident:I:evidence:1:profile:gpu-alert-v1</text><path d="M1100 396 H1524" stroke="#bfc0c0"/><text x="1100" y="422" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="1100" y="448" class="mono" text-anchor="start">R  cluster_registry / 정책은 기동 설정</text><text x="1100" y="469" class="mono" text-anchor="start">I  incident_webhook_receipts, alert_events</text><text x="1100" y="490" class="mono" text-anchor="start">I/U incidents · I incident_evidence_versions</text><text x="1100" y="511" class="mono" text-anchor="start">I/U enqueue_outbox: pending → accepted; job_id=J</text><text x="1100" y="544" class="body muted" text-anchor="start">정책 불일치·오래된 알람이면 원장은 남아도 outbox가 없습니다.</text><rect x="40" y="656" width="464" height="392" rx="8" fill="white" stroke="#bfc0c0"/><text x="60" y="684" class="name" text-anchor="start">04  JC: 접수 후 Worker claim</text><text x="60" y="708" class="body muted" text-anchor="start">Worker → POST /claims · JC → claim 응답</text><text x="60" y="744" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="60" y="770" class="mono" text-anchor="start">job_id = J · incident_id = I · attempt_no = 1</text><text x="60" y="791" class="mono" text-anchor="start">jobs.input_snapshot = input + incident_snapshot</text><text x="60" y="812" class="mono" text-anchor="start">versions.knowledge = [{knowledge_id:K,revision:2,...}]</text><text x="60" y="833" class="mono" text-anchor="start">claim = {input, versions, lease, claim_token, ...}</text><text x="60" y="854" class="mono" text-anchor="start">status: queued → running · stage: claimed</text><path d="M60 876 H484" stroke="#bfc0c0"/><text x="60" y="902" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="60" y="928" class="mono" text-anchor="start">R  snapshot / knowledge_revisions / service_profiles</text><text x="60" y="949" class="mono" text-anchor="start">I/U jobs · I job_attempts, slot_reservations</text><text x="60" y="970" class="mono" text-anchor="start">I/U workers · U capacity_state</text><text x="60" y="991" class="mono" text-anchor="start">heartbeat: jobs.stage / attempts.lease_expires_at</text><text x="60" y="1024" class="body muted" text-anchor="start">Runbook revision/hash는 claim이 아니라 JC 접수 시 고정합니다.</text><rect x="560" y="656" width="464" height="392" rx="8" fill="#fff7f2" stroke="#eb6c36"/><text x="580" y="684" class="name" text-anchor="start">05  RCA: 수집·분석·후보 저장</text><text x="580" y="708" class="body muted" text-anchor="start">NAT Orchestrator → Observation → Synthesis</text><text x="580" y="744" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="580" y="770" class="mono" text-anchor="start">Runbook: RB-XID-79 (발행·환경 검토 후)</text><text x="580" y="791" class="mono" text-anchor="start">D09·D05 로그 → 부족 시 D02 metric → LLM</text><text x="580" y="812" class="mono" text-anchor="start">evidence = [E1, E2, ...] · candidate_id = C</text><text x="580" y="833" class="mono" text-anchor="start">body.result_status = &quot;partial&quot;  (예시)</text><text x="580" y="854" class="mono" text-anchor="start">missing_inputs에 미확인 원인·대상 조건 보존</text><path d="M580 876 H1004" stroke="#bfc0c0"/><text x="580" y="902" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="580" y="928" class="mono" text-anchor="start">R  incident_evidence_versions, knowledge_revisions</text><text x="580" y="949" class="mono" text-anchor="start">R  jobs / job_attempts (저장 직전 lease 검사)</text><text x="580" y="970" class="mono" text-anchor="start">I  evidence + result_candidates (한 트랜잭션)</text><text x="580" y="991" class="mono" text-anchor="start">분석 중 증거는 메모리; 중간 DB 저장은 없음</text><text x="580" y="1024" class="body muted" text-anchor="start">저장 뒤 POST /jobs/J/complete {candidate_id:C, hash,...}</text><rect x="1080" y="656" width="464" height="392" rx="8" fill="white" stroke="#bfc0c0"/><text x="1100" y="684" class="name" text-anchor="start">06  JC: 결과 공개 → 조회·보고서</text><text x="1100" y="708" class="body muted" text-anchor="start">complete 검증 → Backend / Ops Agent가 공개 결과 참조</text><text x="1100" y="744" class="tag" text-anchor="start">DATA  /  대표 입력·출력</text><text x="1100" y="770" class="mono" text-anchor="start">jobs.status = &quot;succeeded&quot;</text><text x="1100" y="791" class="mono" text-anchor="start">jobs.published_result_id = C</text><text x="1100" y="812" class="mono" text-anchor="start">result_candidates.id = C · body.incident_id = I</text><text x="1100" y="833" class="mono" text-anchor="start">body.evidence_refs = [E1,E2,...]</text><text x="1100" y="854" class="mono" text-anchor="start">원인 후보/한계는 body에서 조회</text><path d="M1100 876 H1524" stroke="#bfc0c0"/><text x="1100" y="902" class="tag" text-anchor="start">DB  /  이 단계에서 확인</text><text x="1100" y="928" class="mono" text-anchor="start">R  result_candidates (attempt / schema / hash)</text><text x="1100" y="949" class="mono" text-anchor="start">U  jobs / job_attempts / slot_reservations</text><text x="1100" y="970" class="mono" text-anchor="start">Backend·Ops: jobs JOIN result_candidates</text><text x="1100" y="991" class="mono" text-anchor="start">RCA 완료로 incidents를 자동 close하지 않음</text><text x="1100" y="1024" class="body muted" text-anchor="start">succeeded는 공개 성공; 원인 확정·회복 성공과 다릅니다.</text><text x="40" y="1100" class="name" text-anchor="start">추적 기준  I = incident_id  →  J = job_id  →  (J, attempt_no)  →  C = published_result_id  →  evidence_refs = E*</text><text x="40" y="1132" class="body" text-anchor="start">하나의 제품 PostgreSQL 안에서 테이블 소유자가 다릅니다. Runbook 등록·발행은 Backend 소유이며 Helm upgrade와 별도입니다.</text><text x="40" y="1156" class="body muted" text-anchor="start">기본 1.3 경로는 incident_alert_lifecycles에 쓰지 않습니다. 1.4 에피소드 경로와 혼용하지 마세요. 상세 SQL: verify-flow.sql</text><path d="M40 1188 H1544" stroke="#bfc0c0"/><text x="40" y="1216" class="body muted" text-anchor="start">R 조회 · I 추가 · U 갱신  |  실선: 전달/순서  |  점선: 조건부 경로  |  I/J/C/E/K: 그림용 ID 약칭</text><text x="40" y="1240" class="body muted" text-anchor="start">원본: HTML · 벡터: SVG · 출력: PNG  |  노드별 테이블은 핵심 점검 대상; 전체 열·분기·SQL·코드 근거는 README.md 참고.</text></svg>