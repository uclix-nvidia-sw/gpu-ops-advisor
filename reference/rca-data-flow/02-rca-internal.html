<title id="internal-title">02  RCA Agent 내부: 데이터와 DB 경계</title><desc id="internal-desc">하나의 Worker 프로세스 · 하나의 NAT workflow · 하나의 JC lease 안에서 query별 수집 작업을 병렬 실행합니다.</desc><defs><style>text{font-family:'Geist','Noto Sans KR','Malgun Gothic',sans-serif;fill:#2d3142}

<text x="40" y="40" class="mono muted" text-anchor="start">GPU OPS ADVISOR  /  MAIN 02aec60  /  2026-09-28</text><text x="40" y="96" class="title" text-anchor="start">02  RCA Agent 내부: 데이터와 DB 경계</text><text x="40" y="128" class="body muted" text-anchor="start">하나의 Worker 프로세스 · 하나의 NAT workflow · 하나의 JC lease 안에서 query별 수집 작업을 병렬 실행합니다.</text><path d="M792 336 V376" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 528 V568" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 720 V760" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 912 V952" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 1104 V1144" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M792 1296 V1336" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><path d="M120 452 H64 Q56 452 56 460 V1212 Q56 1220 64 1220 H120" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M1464 836 H1512 Q1520 836 1520 828 V652 Q1520 644 1512 644 H1464" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow-link)" stroke-dasharray="6 5"/><rect x="1154.0" y="730" width="172" height="22" rx="2" fill="#f5f5f5" stroke="#f5f5f5"/><text x="1240" y="745" class="mono muted" text-anchor="middle">추가 query 1개 · 최대 1회</text><rect x="120" y="184" width="1344" height="152" rx="8" fill="white" stroke="#bfc0c0"/><text x="140" y="212" class="name" text-anchor="start">01  Claim 검증 + 읽기 snapshot</text><text x="140" y="235" class="body muted" text-anchor="start">Worker가 입력·deadline 검증 후 Store.read_context()를 실행</text><text x="140" y="264" class="mono" text-anchor="start">IN  J / attempt_no=1 / incident_id=I / evidence_version=1</text><text x="140" y="286" class="mono" text-anchor="start">OUT incident_snapshot + 고정된 Runbook + data_cutoff_at</text><text x="140" y="308" class="mono" text-anchor="start">사건 snapshot/hash 대조 · R06/R07/R09만 과거 사건·조치 추가 조회</text><path d="M1000 200 V320" stroke="#bfc0c0"/><text x="1020" y="212" class="tag" text-anchor="start">DB CHECK  /  01</text><text x="1020" y="239" class="mono" text-anchor="start">R incident_evidence_versions: (I,1)</text><text x="1020" y="260" class="mono" text-anchor="start">R knowledge_revisions: versions.knowledge</text><text x="1020" y="281" class="mono" text-anchor="start">조건부 R incidents / jobs / candidates</text><text x="1020" y="302" class="mono" text-anchor="start">조건부 R review_records(kind=action)</text><rect x="120" y="376" width="1344" height="152" rx="8" fill="#fff7f2" stroke="#eb6c36"/><text x="140" y="404" class="name" text-anchor="start">02  Orchestrator: 코드 검색·Runbook·조사 계획</text><text x="140" y="427" class="body muted" text-anchor="start">LLM 없이 Python 검색/조건 평가 · DB의 고정 revision을 메모리에서 평가</text><text x="140" y="456" class="mono" text-anchor="start">IN  reason → clue &quot;xid:79&quot; · k8s_node_name → runtime target.node=&quot;dgx01&quot;</text><text x="140" y="478" class="mono" text-anchor="start">OUT RB-XID-79 → required=[D09,D05], optional=[D02] · 코드 단서는 검증 fact 아님</text><text x="140" y="500" class="mono" text-anchor="start">전용 미일치→승인 일반 계획 · 둘 다 없으면 06으로 / 유효 fast path도 06으로</text><path d="M1000 392 V512" stroke="#bfc0c0"/><text x="1020" y="404" class="tag" text-anchor="start">DB CHECK  /  02</text><text x="1020" y="431" class="mono" text-anchor="start">DB 추가 조회·쓰기 없음</text><text x="1020" y="452" class="mono" text-anchor="start">메모리: incident_snapshot / alert_clues</text><text x="1020" y="473" class="mono" text-anchor="start">메모리: runbook_selection</text><text x="1020" y="494" class="mono" text-anchor="start">현재 267개 조사용 초안은 fast path 불가</text><rect x="120" y="568" width="1344" height="152" rx="8" fill="white" stroke="#bfc0c0"/><text x="140" y="596" class="name" text-anchor="start">03  Observation: 계획별 수집 → 응답 병합</text><text x="140" y="619" class="body muted" text-anchor="start">D09·D05 병렬 task → Grafana MCP → Loki / 선택 D02 → Mimir</text><text x="140" y="648" class="mono" text-anchor="start">IN  scope=cpc-1 · node=dgx01 · time_range=02:30:00Z~03:00:05Z</text><text x="140" y="670" class="mono" text-anchor="start">OUT E-log: query_id=D09, snapshot=&lt;원문&gt;, tool_status=ok/partial/unavailable</text><text x="140" y="692" class="mono" text-anchor="start">OUT E-metric: D02=GPU_UTIL(0 percent 예시); quality에 round/sub_agent_id</text><path d="M1000 584 V704" stroke="#bfc0c0"/><text x="1020" y="596" class="tag" text-anchor="start">DB CHECK  /  03</text><text x="1020" y="623" class="mono" text-anchor="start">제품 DB 쓰기 없음; evidence[]에 누적</text><text x="1020" y="644" class="mono" text-anchor="start">메모리: observation_plan / D09 / D05</text><text x="1020" y="665" class="mono" text-anchor="start">선택 D02, datasource 발견 근거도 보존</text><text x="1020" y="686" class="mono" text-anchor="start">D05 node 필터는 기본 설정에 없음</text><rect x="120" y="760" width="1344" height="152" rx="8" fill="white" stroke="#bfc0c0"/><text x="140" y="788" class="name" text-anchor="start">04  코드 정규화·충분성 평가 → 필요 시 제한 재조사</text><text x="140" y="811" class="body muted" text-anchor="start">같은 대상·시각·완전성·producer 계약을 검증; 미확인 값은 unknown</text><text x="140" y="840" class="mono" text-anchor="start">OUT sufficiency={round:0, decision:insufficient_actionable, remaining:[D02]}</text><text x="140" y="862" class="mono" text-anchor="start">추가 query: LLM이 승인 목록에서 1개 선택; endpoint 없으면 코드가 첫 query 선택</text><text x="140" y="884" class="mono" text-anchor="start">예산·시간·재조사 한도 도달 또는 추가 조회 불가 → 05에서 수집 결과 분석</text><path d="M1000 776 V896" stroke="#bfc0c0"/><text x="1020" y="788" class="tag" text-anchor="start">DB CHECK  /  04</text><text x="1020" y="815" class="mono" text-anchor="start">DB 쓰기 없음</text><text x="1020" y="836" class="mono" text-anchor="start">메모리: sufficiency (round별)</text><text x="1020" y="857" class="mono" text-anchor="start">producer_contract/error_code 미검증 보존</text><text x="1020" y="878" class="mono" text-anchor="start">raw reason을 원인 확정에 사용하지 않음</text><rect x="120" y="952" width="1344" height="152" rx="8" fill="white" stroke="#bfc0c0"/><text x="140" y="980" class="name" text-anchor="start">05  Synthesis LLM → 응답 구조·증거 참조 검증</text><text x="140" y="1003" class="body muted" text-anchor="start">수집 뒤 반드시 분석 단계로 연결; endpoint·사용 가능한 증거가 있어야 LLM 호출</text><text x="140" y="1032" class="mono" text-anchor="start">IN 정규화 health / metric / 관계 + observation_refs + Runbook 지침 + gaps</text><text x="140" y="1054" class="mono" text-anchor="start">OUT hypotheses → cause_candidates[causal_status=&quot;candidate&quot;]</text><text x="140" y="1076" class="mono" text-anchor="start">원문 로그 전체를 직접 넘기지 않음 · 증거 없음=no_usable_evidence / endpoint 없음=unconfigured</text><path d="M1000 968 V1088" stroke="#bfc0c0"/><text x="1020" y="980" class="tag" text-anchor="start">DB CHECK  /  05</text><text x="1020" y="1007" class="mono" text-anchor="start">DB 쓰기 없음</text><text x="1020" y="1028" class="mono" text-anchor="start">메모리: rca_synthesis</text><text x="1020" y="1049" class="mono" text-anchor="start">analysis.status=complete/failed/...</text><text x="1020" y="1070" class="mono" text-anchor="start">참조 검증은 원인 진실성 증명이 아님</text><rect x="120" y="1144" width="1344" height="152" rx="8" fill="#fff7f2" stroke="#eb6c36"/><text x="140" y="1172" class="name" text-anchor="start">06  결과 조립·검증 → 증거와 후보 원자 저장</text><text x="140" y="1195" class="body muted" text-anchor="start">Worker가 heartbeat/cancel 확인 후 Store.save(); 오래된 attempt 저장 차단</text><text x="140" y="1224" class="mono" text-anchor="start">OUT result_status=partial (예시), missing_inputs=[causal_confirmation_evidence,...]</text><text x="140" y="1246" class="mono" text-anchor="start">TX  evidence E* + result_candidates C(validation_status=valid, content_hash=H)</text><text x="140" y="1268" class="mono" text-anchor="start">여기서 앞 단계의 메모리 기록을 일괄 저장 · 저장 전 crash면 evidence 행이 없을 수 있음</text><path d="M1000 1160 V1280" stroke="#bfc0c0"/><text x="1020" y="1172" class="tag" text-anchor="start">DB CHECK  /  06</text><text x="1020" y="1199" class="mono" text-anchor="start">R jobs + job_attempts: 유효 lease/fence</text><text x="1020" y="1220" class="mono" text-anchor="start">I evidence: J + attempt_no=1 + query_id</text><text x="1020" y="1241" class="mono" text-anchor="start">I result_candidates: C + body + hash</text><text x="1020" y="1262" class="mono" text-anchor="start">동일 트랜잭션; Agent는 jobs를 갱신 안 함</text><rect x="120" y="1336" width="1344" height="152" rx="8" fill="white" stroke="#bfc0c0"/><text x="140" y="1364" class="name" text-anchor="start">07  Worker complete 요청 → JC 발행</text><text x="140" y="1387" class="body muted" text-anchor="start">POST /jobs/J/complete {attempt_no, claim_token, candidate_id:C, content_hash:H}</text><text x="140" y="1416" class="mono" text-anchor="start">JC: 현재 attempt / hash / schema / 입력 계약 확인 → published_result_id=C</text><text x="140" y="1438" class="mono" text-anchor="start">OUT jobs.status=succeeded · body.result_status=partial은 그대로 유지 가능</text><text x="140" y="1460" class="mono" text-anchor="start">Backend·보고서는 C와 그 hash 참조 · incidents.state/원인 필드를 자동 갱신하지 않음</text><path d="M1000 1352 V1472" stroke="#bfc0c0"/><text x="1020" y="1364" class="tag" text-anchor="start">DB CHECK  /  07</text><text x="1020" y="1391" class="mono" text-anchor="start">JC R result_candidates</text><text x="1020" y="1412" class="mono" text-anchor="start">JC U jobs: published_result_id=C</text><text x="1020" y="1433" class="mono" text-anchor="start">JC U job_attempts: ended_at/completion_response</text><text x="1020" y="1454" class="mono" text-anchor="start">JC U slot_reservations: released</text><text x="120" y="1528" class="body" text-anchor="start">점선 분기: 02에서 승인 계획이 없으면 수집·LLM 없이 부족 입력을 저장합니다. fast path는 비조사형 Runbook과 충분한 검증 fact가 있을 때만 가능합니다.</text><text x="120" y="1552" class="body muted" text-anchor="start">실행 중 상태는 jobs.stage / job_attempts에서 확인하세요. evidence 행은 06 저장 후 보입니다. 실패·취소 경로는 /fail과 attempt 종료 사유를 확인합니다.</text><path d="M40 1604 H1544" stroke="#bfc0c0"/><text x="40" y="1632" class="body muted" text-anchor="start">R 조회 · I 추가 · U 갱신  |  실선: 전달/순서  |  점선: 조건부 경로  |  I/J/C/E/K: 그림용 ID 약칭</text><text x="40" y="1656" class="body muted" text-anchor="start">등록 프로필 / 실제 datasource 라벨 / Fleet parser / LLM endpoint는 환경별 확인 대상입니다. 그림은 운영 연결 성공을 가정하지 않습니다.</text></svg></main></body></html>
