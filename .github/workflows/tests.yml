name: Module tests
on:
  workflow_call:
permissions:
  contents: read

jobs:
  go:
    name: Go / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [shared, backend, job-controller, incident]
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: dsx
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dsx_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U dsx -d dsx_test' --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Vet, unit tests and build
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -race ./...
          go build ./...
      - name: Real Backend, JC and Incident E2E
        if: matrix.module == 'backend' || matrix.module == 'incident'
        env:
          E2E_DATABASE_URL: postgres://dsx:ci-only@127.0.0.1:5432/dsx_test?sslmode=disable
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p .local
          go -C backend build -o ../.local/backend-e2e ./cmd/server
          export E2E_BACKEND_BINARY="$GITHUB_WORKSPACE/.local/backend-e2e"
          go -C "$MODULE" test -tags=e2e ./tests -v -count=1 -timeout=10m

  agents:
    name: Python / both agents + real MCP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: dsx
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agent_e2e
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U dsx -d agent_e2e' --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: job-controller/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Install both workers
        run: pip install -r agents/requirements.txt -e shared/python -e rcca-agent -e ops-agent ruff==0.14.0
      - name: Lint
        run: |
          ruff check shared/python/src rcca-agent/src ops-agent/src agents/tests tools/ci
          ruff format --check shared/python/src rcca-agent/src ops-agent/src agents/tests tools/ci
      - name: Build JC and download verified official MCP
        run: |
          mkdir -p .local/mcp-grafana
          go -C job-controller build -o ../.local/job-controller ./cmd/server
          cd .local/mcp-grafana
          release=https://github.com/grafana/mcp-grafana/releases/download/v1.4.2
          curl --fail --location --retry 3 "$release/mcp-grafana_Linux_x86_64.tar.gz" -o mcp-grafana_Linux_x86_64.tar.gz
          curl --fail --location --retry 3 "$release/mcp-grafana_1.4.2_checksums.txt" -o checksums.txt
          grep ' mcp-grafana_Linux_x86_64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf mcp-grafana_Linux_x86_64.tar.gz
      - name: Unit, lifecycle and real process E2E
        env:
          RUN_AGENT_E2E: '1'
          AGENT_E2E_DATABASE_URL: postgres://dsx:ci-only@127.0.0.1:5432/agent_e2e?sslmode=disable
          JC_BINARY: ${{ github.workspace }}/.local/job-controller
          GRAFANA_MCP_BINARY: ${{ github.workspace }}/.local/mcp-grafana/mcp-grafana
        run: python -m pytest -c agents/pytest.ini agents/tests -q --junitxml=.local/agent-e2e/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-results
          include-hidden-files: true
          path: |
            .local/agent-e2e/results.xml
            .local/agent-e2e/*.log
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  chart:
    name: Helm and pipeline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: pip install PyYAML==6.0.2 jsonschema==4.26.0
      - name: Validate GitHub Actions
        run: |
          mkdir -p .local/actionlint
          cd .local/actionlint
          release=https://github.com/rhysd/actionlint/releases/download/v1.7.11
          curl --fail --location --retry 3 "$release/actionlint_1.7.11_linux_amd64.tar.gz" -o actionlint.tar.gz
          curl --fail --location --retry 3 "$release/actionlint_1.7.11_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "actionlint_1.7.11_linux_amd64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  actionlint.tar.gz\n' "$expected" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz
          cd ../..
          .local/actionlint/actionlint
      - run: python tools/ci/check_chart.py
      - run: python -m unittest discover -s tools/ci/tests -v
      - run: python tools/check_links.py
