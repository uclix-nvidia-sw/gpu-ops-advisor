name: Helm package
on:
  workflow_call:
    inputs:
      chart-version:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      namespace:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: dist/images
      - name: Package the exact tested images
        env:
          CHART_VERSION: ${{ inputs.chart-version }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_NAMESPACE: ${{ inputs.namespace }}
        run: python tools/ci/package_chart.py
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ inputs.chart-version }}
          path: |
            dist/*.tgz
            dist/*.sha256
            dist/rendered.yaml
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish release chart to OCI
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_NAMESPACE: ${{ inputs.namespace }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
          helm push dist/*.tgz "oci://ghcr.io/$IMAGE_NAMESPACE/charts"
