name: Container images
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      namespace:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: Image / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          outputs: ${{ !inputs.publish && 'type=oci,dest=/tmp/image.tar' || '' }}
          tags: ghcr.io/${{ inputs.namespace }}/gpu-ops-advisor-${{ matrix.component }}:${{ inputs.image-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/${{ inputs.namespace }}/gpu-ops-advisor-${{ matrix.component }}:${{ inputs.image-tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          mkdir -p dist/images
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('dist/images') / (os.environ['COMPONENT'] + '.json')
          p.write_text(json.dumps({k.lower(): os.environ[k] for k in ('COMPONENT','IMAGE','DIGEST','PUBLISHED')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: dist/images/*.json
          retention-days: 14
