name: Container images
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      namespace:
        type: string
        required: true
      stage:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Image / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: ghcr.io/${{ inputs.namespace }}/gpu-ops-advisor-${{ matrix.component }}:${{ inputs.image-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true
      - name: Verify exported image can be loaded
        env:
          IMAGE: ghcr.io/${{ inputs.namespace }}/gpu-ops-advisor-${{ matrix.component }}:${{ inputs.image-tag }}
        run: |
          docker load --input /tmp/image.tar
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          test "$revision" = "$GITHUB_SHA"
      - name: Record image digest
        if: ${{ !inputs.stage }}
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/${{ inputs.namespace }}/gpu-ops-advisor-${{ matrix.component }}:${{ inputs.image-tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PUBLISHED: 'false'
        run: |
          mkdir -p dist/images
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('dist/images') / (os.environ['COMPONENT'] + '.json')
          p.write_text(json.dumps({k.lower(): os.environ[k] for k in ('COMPONENT','IMAGE','DIGEST','PUBLISHED')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: image-${{ matrix.component }}
          path: dist/images/*.json
          retention-days: 14
      - name: Save built image for gated publication
        if: inputs.stage
        uses: actions/upload-artifact@v4
        with:
          name: built-image-${{ matrix.component }}
          path: /tmp/image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
