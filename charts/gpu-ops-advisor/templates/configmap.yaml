apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gpu.fullname" . }}-config
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
data:
  agents.json: |
    {{- include "gpu.config" (dict "root" . "key" "agents" "file" "files/agents.json") | nindent 4 }}
  job-controller.json: |
    {{- include "gpu.config" (dict "root" . "key" "jobController" "file" "files/job-controller.json") | nindent 4 }}
  incident.json: |
    {{- include "gpu.config" (dict "root" . "key" "incident" "file" "files/incident.json") | nindent 4 }}
  nginx.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      location = /healthz { access_log off; return 200 'ok'; }
      location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
      location /api/ {
        proxy_pass http://{{ include "gpu.fullname" . }}-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
      }
      location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
