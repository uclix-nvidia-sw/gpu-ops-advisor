{{- $root := . -}}
{{- $base := include "gpu.fullname" . -}}
{{- $ports := dict "backend" 8080 "frontend" 8080 "job-controller" 8090 "incident" 8091 "grafana-mcp" 8000 -}}
{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $worker := has $name (list "rcca-agent" "ops-agent") }}
{{- $db := or $worker (has $name (list "backend" "job-controller" "incident")) }}
{{- $env := dict }}
{{- if has $name (list "backend" "job-controller" "incident") }}
{{- $_ := set $env "DSX_ALLOW_UNAUTHENTICATED_NETWORK" "true" }}
{{- end }}
{{- if eq $name "backend" }}
{{- $_ := set $env "DSX_ADDRESS" "0.0.0.0:8080" }}
{{- $_ := set $env "DSX_MIGRATE" "true" }}
{{- $_ := set $env "DSX_SEED" (toString $root.Values.configuration.seedDemoData) }}
{{- $_ := set $env "DSX_SCHEDULER_ENABLED" "true" }}
{{- $_ := set $env "DSX_JOB_CONTROLLER_URL" (printf "http://%s-job-controller:8090" $base) }}
{{- $_ := set $env "DSX_INCIDENT_URL" (printf "http://%s-incident:8091" $base) }}
{{- $_ := set $env "DSX_EXECUTION_PROFILE_REVISION" $root.Values.configuration.executionProfileRevision }}
{{- $_ := set $env "DSX_NAMESPACE_REPORT_PROFILE_REVISION" $root.Values.configuration.namespaceReportProfileRevision }}
{{- else if eq $name "job-controller" }}
{{- $_ := set $env "JC_ADDRESS" "0.0.0.0:8090" }}
{{- $_ := set $env "JC_CONFIG_FILE" "/etc/gpu-ops/job-controller.json" }}
{{- $_ := set $env "JC_APPLY_CONFIG" (toString $root.Values.configuration.applyJobController) }}
{{- else if eq $name "incident" }}
{{- $_ := set $env "INCIDENT_ADDRESS" "0.0.0.0:8091" }}
{{- $_ := set $env "INCIDENT_JOB_CONTROLLER_URL" (printf "http://%s-job-controller:8090" $base) }}
{{- $_ := set $env "INCIDENT_CONFIG_FILE" "/etc/gpu-ops/incident.json" }}
{{- $_ := set $env "INCIDENT_APPLY_CONFIG" (toString $root.Values.configuration.applyIncident) }}
{{- else if eq $name "grafana-mcp" }}
{{- $_ := set $env "GRAFANA_URL" $root.Values.grafana.url }}
{{- else if $worker }}
{{- $_ := set $env "DSX_MODEL_HOSTS" ($root.Values.components.backend.env.DSX_MODEL_HOSTS | default "") }}
{{- $_ := set $env "DSX_MODEL_CIDRS" ($root.Values.components.backend.env.DSX_MODEL_CIDRS | default "") }}
{{- $_ := set $env "JC_URL" (printf "http://%s-job-controller:8090/internal/v1" $base) }}
{{- $_ := set $env "GRAFANA_MCP_URL" (printf "http://%s-grafana-mcp:8000/mcp" $base) }}
{{- $_ := set $env "AGENT_CONFIG_FILE" "/etc/gpu-ops/agents.json" }}
{{- $_ := set $env "ARTIFACT_DIR" "/app/artifacts" }}
{{- $_ := set $env "LLM_BASE_URL" $root.Values.llm.baseUrl }}
{{- $_ := set $env "LLM_MODEL" $root.Values.llm.model }}
{{- $_ := set $env "LLM_REQUEST_TIMEOUT_SECONDS" $root.Values.llm.requestTimeoutSeconds }}
{{- $_ := set $env "LLM_DEFAULT_MAX_TOKENS" $root.Values.llm.defaultMaxTokens }}
{{- $_ := set $env "LLM_SYNTHESIS_MAX_TOKENS" $root.Values.llm.synthesisMaxTokens }}
{{- $_ := set $env "LLM_INSIGHT_MAX_TOKENS" $root.Values.llm.insightMaxTokens }}
{{- end }}
{{- $_ := mergeOverwrite $env $component.env }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $base }}-{{ $name }}
  labels:
    {{- include "gpu.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  # Avoid concurrent singleton schedulers/workers and RWO mounts on upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $worker }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-job-controller
          image: {{ include "gpu.image" (dict "root" $root "component" $component) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          command: [python, -c]
          args:
            - |
              import time, urllib.request
              while True:
                  try:
                      urllib.request.urlopen('{{ index $env "JC_URL" }}/health/ready', timeout=3).close()
                      break
                  except Exception:
                      time.sleep(2)
          resources:
            {{- toYaml $component.resources | nindent 12 }}
        - name: wait-for-grafana-mcp
          image: {{ include "gpu.image" (dict "root" $root "component" $component) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          env:
            - name: GRAFANA_MCP_URL
              value: {{ index $env "GRAFANA_MCP_URL" | quote }}
          command: [python, -u, -c]
          args:
            - |
              import os, time, urllib.request
              from urllib.parse import urlsplit, urlunsplit
              endpoint = urlsplit(os.environ['GRAFANA_MCP_URL'])
              health = urlunsplit(endpoint._replace(path='/healthz', query='', fragment=''))
              while True:
                  try:
                      urllib.request.urlopen(health, timeout=3).close()
                      print('Grafana MCP is ready', flush=True)
                      break
                  except Exception as error:
                      print('Waiting for Grafana MCP:', type(error).__name__, flush=True)
                      time.sleep(2)
          resources:
            {{- toYaml $component.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "gpu.image" (dict "root" $root "component" $component) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if eq $name "grafana-mcp" }}
          args:
            - -t
            - streamable-http
            - -address
            - "0.0.0.0:8000"
            - -enabled-tools
            - datasource,prometheus,loki
            - -disable-write
            - -max-loki-log-limit
            - "5000"
            - -grafana-timeout
            - 30s
            - -allowed-hosts
            - {{ printf "localhost:8000,127.0.0.1:8000,%s-grafana-mcp:8000,%s-grafana-mcp.%s:8000,%s-grafana-mcp.%s.svc:8000,%s-grafana-mcp.%s.svc.cluster.local:8000" $base $base $root.Release.Namespace $base $root.Release.Namespace $base $root.Release.Namespace | quote }}
          {{- end }}
          {{- if or $env $db (eq $name "grafana-mcp") }}
          env:
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- if $db }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.database.existingSecret }}
                  key: {{ $root.Values.database.urlKey }}
            {{- end }}
            {{- if eq $name "grafana-mcp" }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.grafana.existingSecret }}
                  key: {{ $root.Values.grafana.tokenKey }}
            {{- end }}
            {{- if and (or $worker (eq $name "backend")) $root.Values.llm.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.llm.existingSecret }}
                  key: {{ $root.Values.llm.apiKeyKey }}
            {{- end }}
          {{- end }}
          {{- if hasKey $ports $name }}
          ports:
            - name: http
              containerPort: {{ index $ports $name }}
          {{- $health := "/healthz" }}
          {{- if eq $name "backend" }}{{- $health = "/api/v1/health/ready" }}{{- end }}
          {{- if has $name (list "job-controller" "incident") }}{{- $health = "/internal/v1/health/ready" }}{{- end }}
          startupProbe:
            httpGet:
              path: {{ $health | replace "/ready" "/live" }}
              port: http
              {{- if eq $name "grafana-mcp" }}
              httpHeaders:
                - name: Host
                  value: {{ $base }}-grafana-mcp:8000
              {{- end }}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ $health }}
              port: http
              {{- if eq $name "grafana-mcp" }}
              httpHeaders:
                - name: Host
                  value: {{ $base }}-grafana-mcp:8000
              {{- end }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ $health | replace "/ready" "/live" }}
              port: http
              {{- if eq $name "grafana-mcp" }}
              httpHeaders:
                - name: Host
                  value: {{ $base }}-grafana-mcp:8000
              {{- end }}
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- if or $worker (has $name (list "frontend" "job-controller" "incident")) }}
          volumeMounts:
            - name: configuration
              mountPath: {{ if eq $name "frontend" }}/etc/nginx/conf.d/default.conf{{ else }}/etc/gpu-ops{{ end }}
              {{- if eq $name "frontend" }}
              subPath: nginx.conf
              {{- end }}
              readOnly: true
            {{- if $worker }}
            - name: artifacts
              mountPath: /app/artifacts
            {{- end }}
          {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ $base }}-config
        {{- if $worker }}
        - name: artifacts
          {{- if and (eq $name "ops-agent") $root.Values.artifacts.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "gpu.artifactsName" $root) $root.Values.artifacts.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
