{{- $root := . -}}
{{- $ports := dict "backend" 8080 "frontend" 8080 "job-controller" 8090 "incident" 8091 "grafana-mcp" 8000 -}}
{{- range $name, $port := $ports }}
{{- if (index $root.Values.components $name).enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gpu.fullname" $root }}-{{ $name }}
  labels:
    {{- include "gpu.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
{{- if eq $name "frontend" }}
  type: {{ $root.Values.frontendService.type }}
{{- else }}
  type: ClusterIP
{{- end }}
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- if and (eq $name "frontend") (eq $root.Values.frontendService.type "NodePort") }}
      nodePort: {{ $root.Values.frontendService.nodePort }}
{{- end }}
{{- end }}
{{- end }}
