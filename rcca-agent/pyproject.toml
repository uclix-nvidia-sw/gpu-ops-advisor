[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rcca-agent"
version = "1.3.0"
requires-python = ">=3.11,<3.14"
dependencies = ["gpu-ops-agent-common==1.3.0", "nvidia-nat==1.5.0", "nvidia-nat-mcp==1.5.0", "langchain-core==1.6.3"]

[project.scripts]
rcca-agent = "rcca_agent.main:main"

[project.entry-points.'nat.components']
rcca_agent = "rcca_agent.nat_workflow"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rcca_agent = ["report_labels.json"]
