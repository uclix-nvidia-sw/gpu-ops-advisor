은 별도 추론 계층이다.</desc><defs><marker id="dsx-full-backend-arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#596D81"/></marker><marker id="dsx-full-backend-accent" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#16866C"/></marker><marker id="dsx-full-backend-link" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#2468CF"/></marker><marker id="dsx-full-backend-log" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#D14A57"/></marker></defs><rect width="1920" height="1080" fill="#F7F9FC"/><rect x="320" y="168" width="1560" height="840" rx="8" fill="#F7F9FC" stroke="#CCD5DE" stroke-width="1.5" stroke-dasharray="8 6"/><text x="336" y="196" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#596D81" font-weight="600">CSC / 관측 · 애플리케이션 · 저장 · 추론</text><rect x="568" y="400" width="1008" height="608" rx="8" fill="#F7F9FC" stroke="#CCD5DE" stroke-width="1.5" stroke-dasharray="8 6"/><text x="584" y="428" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#596D81" font-weight="600">Backend / 요청·업무 처리 + 두 Agent + 공통 분석 기능</text><path data-edge="metrics" data-source="cpc" data-target="ingress" d="M288 264 L344 264" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-full-backend-link)"/><path data-edge="logs" data-source="cpc" data-target="ingress" d="M288 312 L344 312" fill="none" stroke="#D14A57" stroke-width="2" marker-end="url(#dsx-full-backend-log)"/><path data-edge="metrics-store" data-source="ingress" data-target="obs" d="M552 264 L608 264" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-full-backend-link)"/><path data-edge="logs-store" data-source="ingress" data-target="obs" d="M552 312 L608 312" fill="none" stroke="#D14A57
