<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1160" viewBox="0 0 2400 1160"><title>DSX 장애 분석과 운영보고서의 근거 처리 흐름</title><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2468CF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D14A57"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16866C"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637587"/></marker></defs><rect width="100%" height="100%" fill="#F7F9FC"/><g font-family="Malgun Gothic, sans-serif"><text x="60" y="75" font-size="43" fill="#172B42" font-weight="700" text-anchor="start">장애 한 건이 분석과 보고서로 이어지는 방식</text><text x="60" y="120" font-size="25" fill="#596D81" font-weight="400" text-anchor="start">관측 원본 · Incident 상태 · 분석 결과를 분리해 추적하는 상세 흐름</text><rect x="60" y="180" width="510" height="220" rx="15" fill="white" stroke="#C9D5DF" stroke-width="2"/><rect x="80" y="200" width="50" height="31" rx="7" fill="#16866C" stroke="#16866C" stroke-width="2"/><text x="105.0" y="223" font-size="19" fill="white" font-weight="700" text-anchor="middle">01</text><text x="150" y="229" font-size="30" fill="#172B42" font-weight="700" text-anchor="start">관측 근거</text><text x="85" y="278" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">Loki : event / component health</text><text x="85" y="314" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">Mimir : DCGM · Node metrics</text><text x="85" y="350" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">발생 시각 + 자산 식별자</text><path d="M 570 289 L 650 289" fill="none" stroke="#16866C" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><rect x="650" y="180" width="510" height="220" rx="15" fill="white" stroke="#C9D5DF" stroke-width="2"/><rect x="670" y="200" width="50" height="31" rx="7" fill="#16866C" stroke="#16866C" stroke-width="2"/><text x="695.0" y="223" font-size="19" fill="white" font-weight="700" text-anchor="middle">02</text><text x="740" y="229" font-size="30" fill="#172B42" font-weight="700" text-anchor="start">알림</text><text x="675" y="278" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">Loki / Mimir Ruler</text><text x="675" y="314" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">Alertmanager webhook</text><text x="675" y="350" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">firing / resolved · 재전송</text><path d="M 1160 289 L 1240 289" fill="none" stroke="#16866C" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><rect x="1240" y="180" width="510" height="220" rx="15" fill="white" stroke="#C9D5DF" stroke-width="2"/><rect x="1260" y="200" width="50" height="31" rx="7" fill="#16866C" stroke="#16866C" stroke-width="2"/><text x="1285.0" y="223" font-size="19" fill="white" font-weight="700" text-anchor="middle">03</text><text x="1330" y="229" font-size="30" fill="#172B42" font-weight="700" text-anchor="start">Incident 정규화</text><text x="1265" y="278" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">원본 이벤트 시각·identity 대조</text><text x="1265" y="314" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">중복·flap 처리 / DB upsert</text><text x="1265" y="350" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">저장 성공 후 RCCA 호출</text><path d="M 1750 289 L 1830 289" fill="none" stroke="#16866C" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><rect x="1830" y="180" width="510" height="220" rx="15" fill="white" stroke="#C9D5DF" stroke-width="2"/><rect x="1850" y="200" width="50" height="31" rx="7" fill="#16866C" stroke="#16866C" stroke-width="2"/><text x="1875.0" y="223" font-size="19" fill="white" font-weight="700" text-anchor="middle">04</text><text x="1920" y="229" font-size="30" fill="#172B42" font-weight="700" text-anchor="start">RCCA 분석</text><text x="1855" y="278" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">GPU / Node 범위 근거 수집</text><text x="1855" y="314" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">공식 문서·내부 사례와 대조</text><text x="1855" y="350" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">원인 가설 + 대응 권고 + 한계</text><rect x="60" y="465" width="1060" height="300" rx="15" fill="#F1F8F5" stroke="#B5D5C8" stroke-width="2"/><text x="85" y="510" font-size="29" fill="#16866C" font-weight="700" text-anchor="start">Incident DB  ·  사실 + 분석 이력</text><text x="85" y="558" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">식별 : incident_id · fingerprint · CPC · Node · GPU UUID</text><text x="85" y="601" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">시간 : 발생 시각 · first_seen · last_seen · analyzed_at</text><text x="85" y="644" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">상태 : firing / resolved 신호 · flap_count · 복구 확인</text><text x="85" y="687" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">결과 : 원인 가설 · 권고 · 근거 링크 · 분석 버전</text><rect x="1240" y="465" width="1100" height="300" rx="15" fill="#F3F0F8" stroke="#CFC2DD" stroke-width="2"/><text x="1265" y="510" font-size="29" fill="#71538D" font-weight="700" text-anchor="start">Knowledge Base  ·  재사용할 수 있는 지식</text><text x="1265" y="558" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">NVIDIA 공식 문서 · XID 가이드 · 내부 Runbook</text><text x="1265" y="601" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">원문 버전과 출처를 보존하고 검색 인덱스로 조회</text><text x="1265" y="644" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">Incident를 그대로 지식으로 확정하지 않음</text><text x="1265" y="687" font-size="24" fill="#596D81" font-weight="400" text-anchor="start">운영자가 검토한 사례를 재사용 지식으로 정리</text><path d="M 1495 400 L 1495 431 L 590 431 L 590 465" fill="none" stroke="#16866C" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="730" y="423" font-size="20" fill="#16866C" font-weight="400" text-anchor="start">Incident 저장</text><path d="M 2085 400 L 2085 450 L 1155 450 L 1155 570 L 1120 570" fill="none" stroke="#16866C" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="1170" y="625" font-size="20" fill="#16866C" font-weight="400" text-anchor="start">결과</text><text x="1170" y="653" font-size="20" fill="#16866C" font-weight="400" text-anchor="start">저장</text><path d="M 2295 400 L 2295 465" fill="none" stroke="#637587" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#grey)"/><rect x="60" y="835" width="1060" height="245" rx="15" fill="#FFFDF7" stroke="#DED4BA" stroke-width="2"/><text x="85" y="879" font-size="28" fill="#846D35" font-weight="700" text-anchor="start">복구 상태는 별도로 확인</text><text x="85" y="926" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">같은 이벤트가 반복 출력된 횟수 ≠ 새 장애 발생 횟수</text><text x="85" y="962" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">로그가 없음 / events=[] / 알림 resolved ≠ 복구 완료</text><text x="85" y="998" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">대상 component의 Healthy + 지표 정상 + 데이터 최신성 확인</text><text x="85" y="1034" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">확인 근거를 남긴 뒤 Incident 종료</text><rect x="1240" y="835" width="1100" height="245" rx="15" fill="#F1F8F5" stroke="#B5D5C8" stroke-width="2"/><text x="1265" y="879" font-size="28" fill="#16866C" font-weight="700" text-anchor="start">최적화 운영보고서 작성 Agent</text><text x="1265" y="926" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">Q 관측 추세 + I 반복 장애/분석 이력 + K 운영 기준 조회</text><text x="1265" y="962" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">대상·기간·집계 기준을 고정해 운영 현황과 개선안 작성</text><text x="1265" y="998" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">초기 범위 : GPU / Node 자원 추세와 운영 이력</text><text x="1265" y="1034" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">K8s 배치·요청량 / Pod 실사용은 각 수집·매핑 검증 후 추가</text><text x="60" y="1130" font-size="23" fill="#596D81" font-weight="400" text-anchor="start">이 문서는 목표 동작 설계이며, 기존 클러스터에서 모든 구간이 구현·검증되었다는 의미는 아닙니다.</text></g></svg>