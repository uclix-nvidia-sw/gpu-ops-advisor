<title id="dsx-job-controller-title">DSX 가용 자원 내 큐 관리·잡 배분 개발 구조 v1.3</title>
<desc id="dsx-job-controller-desc">GUI는 Backend를 통해 RCA 결과를 조회하고 보고서를 요청한다. Backend 내부의 정기 보고서 스케줄러도 같은 보고서 큐를 사용한다. Grafana 알람을 받은 Incident만 RCA 실행을 요청한다. Job Controller가 RCA·보고서 영속 큐와 잡 상태를 관리하고 두 Agent가 잡을 인수한다. Job Controller는 기존 Agent와 공유 추론의 설정된 동시 처리 한도 내에서 잡을 배분한다. 자원이 부족하면 잡을 큐에 보존한다. Agent 배포 수와 자원 변경은 운영자가 수동으로 수행한다. 챗봇 기능과 인증 흐름은 제외한 개발 구조 v1.3이다.</desc>
