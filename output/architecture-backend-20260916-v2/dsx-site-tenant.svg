<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="dsx-site-tenant-title dsx-site-tenant-desc"><title id="dsx-site-tenant-title">03 사이트별 저장·조회 · 하나의 CSC, 사이트별 tenant</title><desc id="dsx-site-tenant-desc">하나의 CSC에서 여러 사이트를 운영하는 목표 설계. 사이트 A와 B 수집 신원을 Gateway가 검증하고 tenant 헤더를 재설정한다. Mimir는 사이트별 TSDB와 저장 블록을 분리하지만 컴포넌트와 자원은 공유할 수 있다. 사용자 조회는 Backend 또는 Grafana의 권한 강제 경계를 통과하며 허용된 사이트 tenant만 선택한다. 권한 없는 요청은 경계에서 거부한다. Keycloak 신원과 tenant 식별자는 다르고 통합 조회는 명시적 권한을 요구한다.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style><marker id="dsx-site-tenant-arrow" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#596D81"/></marker><marker id="dsx-site-tenant-accent" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#16866C"/></marker><marker id="dsx-site-tenant-link" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#2468CF"/></marker><marker id="dsx-site-tenant-log" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6Z" fill="#D14A57"/></marker></defs><rect width="1920" height="1080" fill="#F7F9FC"/><rect x="440" y="184" width="1440" height="824" rx="8" fill="#F7F9FC" stroke="#CCD5DE" stroke-width="1.5" stroke-dasharray="8 6"/><text x="456" y="212" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#596D81" font-weight="600">CSC / 검증된 신원과 권한으로만 tenant 결정</text><rect x="928" y="232" width="928" height="760" rx="8" fill="#F7F9FC" stroke="#CCD5DE" stroke-width="1.5" stroke-dasharray="8 6"/><text x="944" y="260" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#596D81" font-weight="600">공통 Mimir / tenant별 저장 영역 · 컴포넌트·자원은 공유 가능</text><path data-edge="ingest-a" data-source="site-a" data-target="write" d="M392 320 L464 320" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-site-tenant-link)"/><path data-edge="ingest-b" data-source="site-b" data-target="write" d="M392 496 L464 496" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-site-tenant-link)"/><path data-edge="write-a" data-source="write" data-target="tenant-a" d="M856 344 L952 344" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-site-tenant-link)"/><path d="M904 352 Q920 344 904 336" fill="none" stroke="#F7F9FC" stroke-width="7"/><path data-edge="write-b" data-source="write" data-target="tenant-b" d="M856 456 L896 456 Q904 456 904 448 L904 352 Q920 344 904 336 L904 288 Q904 280 912 280 L1560 280 Q1568 280 1568 288 L1568 312" fill="none" stroke="#2468CF" stroke-width="2" marker-end="url(#dsx-site-tenant-link)"/><path data-edge="user-query" data-source="user" data-target="read" d="M392 704 L464 704" fill="none" stroke="#16866C" stroke-width="2" marker-end="url(#dsx-site-tenant-accent)" marker-start="url(#dsx-site-tenant-accent)"/><path data-edge="login" data-source="user" data-target="idp" d="M216 784 L216 856" fill="none" stroke="#16866C" stroke-width="2" marker-end="url(#dsx-site-tenant-accent)" marker-start="url(#dsx-site-tenant-accent)"/><path data-edge="store-a" data-source="tenant-a" data-target="objects" d="M1120 616 L1120 856" fill="none" stroke="#596D81" stroke-width="2" marker-end="url(#dsx-site-tenant-arrow)" marker-start="url(#dsx-site-tenant-arrow)"/><path data-edge="store-b" data-source="tenant-b" data-target="objects" d="M1680 616 L1680 856" fill="none" stroke="#596D81" stroke-width="2" marker-end="url(#dsx-site-tenant-arrow)" marker-start="url(#dsx-site-tenant-arrow)"/><path data-edge="read-a" data-source="read" data-target="tenant-a" d="M856 704 L992 704 Q1000 704 1000 696 L1000 616" fill="none" stroke="#596D81" stroke-width="2" marker-end="url(#dsx-site-tenant-arrow)" stroke-dasharray="7 5"/><path d="M1112 752 Q1120 736 1128 752" fill="none" stroke="#F7F9FC" stroke-width="7"/><path data-edge="read-b" data-source="read" data-target="tenant-b" d="M856 752 L1112 752 Q1120 736 1128 752 L1400 752 Q1408 752 1408 744 L1408 616" fill="none" stroke="#596D81" stroke-width="2" marker-end="url(#dsx-site-tenant-arrow)" stroke-dasharray="7 5"/><text x="40" y="40" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">DSX / ARCHITECTURE / 2026.09.16</text><text x="40" y="94" font-family="'Instrument Serif','Noto Serif KR','Batang',serif" font-size="40" fill="#172B42" font-weight="400">03 사이트별 저장·조회 · 하나의 CSC, 사이트별 tenant</text><text x="40" y="132" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" fill="#596D81" font-weight="400">목표 설계 · 미배포  |  인증 토큰=신원 확인 / tenant ID=데이터 영역 / 시간·라벨 인덱스=검색  |  CPC 내부 수집 유지</text><g data-node="site-a"><rect x="40" y="248" width="352" height="128" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="56" y="280" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">사이트 A · Alloy</text><text x="56" y="308" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">기존 CPC 수집 구성 유지</text><text x="56" y="332" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">인증된 수집 서비스 신원 A</text><text x="56" y="356" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트 안에 여러 CPC 포함 가능</text></g><g data-node="site-b"><rect x="40" y="440" width="352" height="128" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="56" y="472" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">사이트 B · Alloy</text><text x="56" y="500" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">기존 CPC 수집 구성 유지</text><text x="56" y="524" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">인증된 수집 서비스 신원 B</text><text x="56" y="548" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">cluster_id·GPU·Node 라벨 유지</text></g><g data-node="write"><rect x="464" y="296" width="392" height="232" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="480" y="328" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">수집 Gateway · 쓰기 권한</text><text x="480" y="356" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">서비스 토큰 검증 → 등록된 site 매핑</text><text x="480" y="380" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">클라이언트 tenant 헤더 제거·재설정</text><text x="480" y="404" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">허용한 단일 tenant로만 수집 전송</text><text x="480" y="428" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">미인증·미등록·범위 불일치는 거부</text><text x="480" y="452" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">직접 Mimir 접근 경로도 제한</text></g><g data-node="user"><rect x="40" y="656" width="352" height="128" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="56" y="688" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">사용자 · Frontend / Grafana</text><text x="56" y="716" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">A 운영자: A만 / B 운영자: B만</text><text x="56" y="740" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">통합 운영자: 허용된 사이트 집합</text><text x="56" y="764" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트 ID 변경만으로 권한 획득 불가</text></g><g data-node="read"><rect x="464" y="656" width="392" height="192" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="480" y="688" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">Backend / Grafana 조회 경계</text><text x="480" y="716" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">검증된 신원 + 기능·사이트 권한 확인</text><text x="480" y="740" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">요청 사이트 ⊆ 허용 사이트 검사</text><text x="480" y="764" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">허용 집합으로 tenant 헤더 재설정</text><text x="480" y="788" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">통합 조회: federation + 별도 권한</text><text x="480" y="812" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">Grafana 직접 조회도 같은 정책 강제</text></g><g data-node="idp"><rect x="40" y="856" width="352" height="128" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="56" y="888" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">Keycloak · 신원 발급</text><text x="56" y="916" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">OIDC 연동은 후속 구현</text><text x="56" y="940" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">토큰 갱신·회전과 tenant ID는 독립</text><text x="56" y="964" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">한 사용자가 여러 사이트 권한 보유 가능</text></g><g data-node="tenant-a"><rect x="952" y="312" width="392" height="304" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="968" y="344" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">Tenant: site-a</text><text x="968" y="372" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트 A의 TSDB·블록</text><text x="968" y="396" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">메트릭 이름·라벨 자동 인덱싱</text><text x="968" y="420" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">시간 범위로 대상 블록 선택</text><text x="968" y="444" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">tenant별 보존·수집/조회 한도</text><text x="968" y="468" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">저장 영역과 인증을 구분</text><text x="968" y="492" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">tenant ID는 비밀 인증값이 아님</text><text x="968" y="516" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">토큰별 DB·사용자별 DB를 만들지 않음</text></g><g data-node="tenant-b"><rect x="1392" y="312" width="440" height="304" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="1408" y="344" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">Tenant: site-b</text><text x="1408" y="372" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트 B의 TSDB·블록</text><text x="1408" y="396" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">메트릭 이름·라벨 자동 인덱싱</text><text x="1408" y="420" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">시간 범위로 대상 블록 선택</text><text x="1408" y="444" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">tenant별 보존·수집/조회 한도</text><text x="1408" y="468" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">저장 영역과 자원 격리를 구분</text><text x="1408" y="492" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">분리만으로 과부하·장애 전파 차단 안 됨</text><text x="1408" y="516" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">필요 용량·캐시·분산·한도를 함께 설계</text></g><g data-node="objects"><rect x="952" y="856" width="880" height="112" rx="8" fill="white" stroke="#CCD5DE" stroke-width="1.5"/><text x="968" y="888" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#172B42" font-weight="600">Object Storage · tenant별 prefix / 블록 / bucket index</text><text x="968" y="916" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트별 저장 객체를 분리해 관리 / 하나의 버킷·스토리지 인프라 공유 가능</text><text x="968" y="940" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400">사이트별 조회는 해당 tenant 안에서 시간·메트릭·라벨로 검색</text></g><text x="480" y="904" font-family="'Geist','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#596D81" font-weight="400"